<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard BI Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1a1f3a;
            --bg-tertiary: #252e48;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-color: rgba(59, 130, 246, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f3a 50%, #0f172a 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .glass-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-hover:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.1);
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-development {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.5);
        }

        .badge-production {
            background: rgba(16, 185, 129, 0.2);
            color: #86efac;
            border: 1px solid rgba(16, 185, 129, 0.5);
        }

        .badge-maintenance {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.5);
        }

        /* Cards */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.5;
        }

        .card-interactive {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-color: rgba(59, 130, 246, 0.2);
        }

        .card-interactive:hover {
            background: var(--bg-tertiary);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.15);
        }

        .card.featured {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2), inset 0 0 20px rgba(59, 130, 246, 0.05);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: white;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
        }

        /* Estilos para botão de link ao lado do status */
        .btn-link-corner {
            padding: 0.5rem 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: white;
            border: none;
            border-radius: 0.5rem;
            width: 2rem;
            height: 2rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            flex-shrink: 0;
        }

        .btn-link-corner:hover {
            transform: translateY(-2px) scale(1.1);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
        }

        .btn-secondary {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 50;
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Loading */
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 1.5rem;
        }

        .loading-message p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
            z-index: 40;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.success {
            border-color: rgba(16, 185, 129, 0.5);
            background: rgba(16, 185, 129, 0.1);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, rgba(26, 31, 58, 0.8), rgba(15, 23, 42, 0.5));
            border-bottom: 1px solid var(--border-color);
            padding: 2rem 1rem;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        /* Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            animation: fadeIn 0.5s ease-out;
            max-width: 600px;
            margin: 0 auto;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state svg {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1rem;
            opacity: 0.3;
        }

        /* Stats */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-weight: 600;
        }

        /* Estilização global para Selects */
        select {
            width: 100%;
            padding: 0.75rem;
            /* Usando uma cor sólida para garantir a renderização dos options */
            background-color: #1e293b; 
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            appearance: none; /* Remove o estilo nativo do SO */
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        /* Efeito de foco para melhorar a UX */
        select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Estilização global para Options */
        select option {
            background-color: #1e293b; /* Mesma cor do select para consistência */
            color: var(--text-primary);
            padding: 10px;
        }

        /* Correção para navegadores baseados em Chromium (Chrome/Edge) 
        Isso força o navegador a respeitar o esquema de cores dark */
        :root {
            color-scheme: dark;
        }

        /* Estilização do rótulo (Label) para seguir o padrão que você usou */
        label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .cards-grid {
                max-width: 100%;
            }

            .modal-content {
                max-width: 100%;
                width: 95%;
                padding: 1.5rem;
            }

            .toast {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
            }
        }

        /* Animations */
        .card {
            animation: fadeIn 0.5s ease-out;
        }

        .card:nth-child(n) {
            animation-delay: calc(0.05s * var(--index, 0));
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-blue);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">⚡ Dashboard BI</div>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-primary" onclick="openCreateModal()">
                    <i data-lucide="plus" style="width: 18px; height: 18px;"></i>
                    Novo Dashboard
                </button>
                <button class="btn btn-primary" onclick="forceRefreshDashboards()" title="Atualizar dados" style="width: auto; padding: 0.75rem 1rem;">
                    <i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Stats -->
        <div class="stats-container" id="statsContainer">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total de Dashboards</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="devCount">0</div>
                <div class="stat-label">Em Desenvolvimento</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="prodCount">0</div>
                <div class="stat-label">Em Produção</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="maintCount">0</div>
                <div class="stat-label">Manutenção</div>
            </div>
        </div>

        <!-- Filtros -->
        <div style="margin-bottom: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
            <!-- Busca por Nome -->
            <div>
                <label style="display: block; color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; font-weight: 600;">Buscar por Nome</label>
                <input type="text" id="filtroNome" placeholder="Digite o nome do BI..." style="width: 100%; padding: 0.75rem; background: rgba(59, 130, 246, 0.05); border: 1px solid var(--border-color); border-radius: 0.75rem; color: var(--text-primary); font-size: 0.875rem; transition: all 0.3s;" oninput="aplicarFiltros()">
            </div>

            <!-- Filtro por Status -->
            <div>
                <label style="display: block; color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; font-weight: 600;">Status</label>
                <select id="filtroStatus" style="width: 100%; padding: 0.75rem; background: rgba(59, 130, 246, 0.05); border: 1px solid var(--border-color); border-radius: 0.75rem; color: var(--text-primary); font-size: 0.875rem; cursor: pointer; transition: all 0.3s;" onchange="aplicarFiltros()">
                    <option value="">Todos os Status</option>
                    <option value="Desenvolvimento">Desenvolvimento</option>
                    <option value="Produção">Produção</option>
                    <option value="Manutenção">Manutenção</option>
                </select>
            </div>

            <!-- Filtro por Responsável -->
            <div>
                <label style="display: block; color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; font-weight: 600;">Responsável</label>
                <select id="filtroResponsavel" style="width: 100%; padding: 0.75rem; background: rgba(59, 130, 246, 0.05); border: 1px solid var(--border-color); border-radius: 0.75rem; color: var(--text-primary); font-size: 0.875rem; cursor: pointer; transition: all 0.3s;" onchange="aplicarFiltros()">
                    <option value="">Todos os Responsáveis</option>
                </select>
            </div>
        </div>

        <!-- Cards Grid -->
        <div class="cards-grid" id="cardsContainer">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <p style="color: var(--text-secondary); font-size: 0.875rem;">Carregando dashboards...</p>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="modalTitle" style="font-size: 1.5rem; font-weight: 800;">Novo Dashboard</h2>
                <button onclick="closeModal()" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.5rem;">×</button>
            </div>

            <form id="form" onsubmit="handleSubmit(event)">
                <input type="hidden" id="formId" value="">

                <div class="form-group">
                    <label class="form-label">Nome do Dashboard *</label>
                    <input type="text" id="formName" class="form-input" placeholder="Ex: Dashboard de Vendas" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Responsável</label>
                    <select id="formResponsavel" class="form-select">
                        <option value="">Sem responsável</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Status *</label>
                    <select id="formStatus" class="form-select" required>
                        <option value="">Selecione um status</option>
                        <option value="Desenvolvimento">Desenvolvimento</option>
                        <option value="Produção">Produção</option>
                        <option value="Manutenção">Manutenção</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Descrição</label>
                    <textarea id="formDescricao" class="form-input" placeholder="Ex: Dashboard com KPIs de vendas..." style="resize: vertical; min-height: 80px;"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Link do Painel</label>
                    <input type="url" id="formLink" class="form-input" placeholder="Ex: https://seu-painel.com/dashboard">
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        <span id="submitText">Salvar</span>
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-message">
            <div class="spinner"></div>
            <p id="loadingText">Processando...</p>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            // APPS_SCRIPT_URL: 'https://script.google.com/macros/d/AKfycbygZSlKm0mR3Gts4hhyiVvMSpysYdyuXYPVWPVwl_UvQyFOTIrj6d9dRgB2UsOqHVZu/userweb',
            APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbx2LR9TcOsfgzvU3Ao8n93yWl-Xq1PNIWp1PCJv57GIdRTPV1SEbuxYMrEL0THfRYpe/exec',
            SHEETS_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRjvlzgCEKvoa8-ihDxVCGPEazUR7U90z3fz_yWEd1tk2Mvx2EUIc5W1Zz8h2DqV7tvbQvKVdkt2rnP/pub?output=csv',
            // URL do CSV da aba "Usuários". Para obter: abra a planilha → clique na aba Usuários
            // → veja o número após #gid= na URL → adicione &gid=NUMERO ao final abaixo.
            SHEETS_USUARIOS_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRjvlzgCEKvoa8-ihDxVCGPEazUR7U90z3fz_yWEd1tk2Mvx2EUIc5W1Zz8h2DqV7tvbQvKVdkt2rnP/pub?output=csv&gid=24023174'
        };

        let allDashboards = [];
        let isEditing = false;
        let dashboardsFiltrados = [];
        let responsaveisUnicos = [];

        // ===== USUÁRIOS =====
        let usuarios = [];

        async function loadUsuarios() {
            try {
                const timestamp = new Date().getTime();
                const url = CONFIG.SHEETS_USUARIOS_CSV_URL + `&t=${timestamp}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csv = await response.text();
                const lines = csv.trim().split('\n');
                // Pula cabeçalho (linha 0), lê primeira coluna de cada linha
                usuarios = lines.slice(1)
                    .map(line => line.split(',')[0].trim().replace(/^"|"$/g, ''))
                    .filter(nome => nome.length > 0);
                console.log('Usuários carregados:', usuarios);
            } catch (error) {
                console.error('Erro ao carregar usuários:', error);
            }
        }

        function populateResponsavelSelect(selectedValue = '') {
            const select = document.getElementById('formResponsavel');
            select.innerHTML = '<option value="">Sem responsável</option>';
            [...usuarios].sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.textContent = u;
                if (u === selectedValue) opt.selected = true;
                select.appendChild(opt);
            });
        }
        // ===== FIM USUÁRIOS =====

        // ===== DEBUG HELPER =====
        console.log('%c🎨 Dashboard BI Manager Iniciado', 'color: #3b82f6; font-size: 16px; font-weight: bold');
        console.log('%c📍 URLs Configuradas:', 'color: #06b6d4; font-weight: bold');
        console.log('CSV:', CONFIG.SHEETS_CSV_URL);
        console.log('Apps Script:', CONFIG.APPS_SCRIPT_URL);
        console.log('%c💡 DICA: Abra a aba Console (F12) para ver logs de debug', 'color: #f59e0b; font-weight: bold');
        console.log('');

        // Função auxiliar de debug
        window.debugInfo = function() {
            console.clear();
            console.log('%c===== INFORMAÇÕES DE DEBUG =====', 'color: #3b82f6; font-size: 14px; font-weight: bold');
            console.log('Dashboards carregados:', allDashboards.length);
            console.log('Lista completa:', allDashboards);
            console.log('CONFIG.SHEETS_CSV_URL:', CONFIG.SHEETS_CSV_URL);
            console.log('CONFIG.APPS_SCRIPT_URL:', CONFIG.APPS_SCRIPT_URL);
            console.log('%c===== FIM =====', 'color: #3b82f6; font-size: 14px; font-weight: bold');
        };
        
        console.log('%c✅ Função debugInfo() disponível. Digite debugInfo() no console.', 'color: #10b981; font-weight: bold');
        // ===== FIM DEBUG HELPER =====

        // Função para inicializar Lucide Icons com retry
        function initLucide() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                // Retry se lucide ainda não estiver carregado
                setTimeout(initLucide, 100);
            }
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                initLucide();
                loadUsuarios();
                loadDashboards();
            }, 500);
        });

        // Load dashboards from Google Sheets CSV
        // silent=true: recarrega sem resetar filtros nem exibir loading (usado pelo sync em background)
        async function loadDashboards(silent = false) {
            if (!silent) showLoading('Carregando dashboards...');
            try
            {
                console.log('%c=== CARREGANDO DASHBOARDS ===', 'color: blue; font-weight: bold');

                // Adicionar timestamp para evitar cache do navegador
                const timestamp = new Date().getTime();
                const csvUrlWithTimestamp = CONFIG.SHEETS_CSV_URL + `&t=${timestamp}`;

                console.log('URL CSV (com cache-busting):', csvUrlWithTimestamp);

                const response = await fetch(csvUrlWithTimestamp);
                console.log('Status da resposta:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const csv = await response.text();
                console.log('CSV recebido. Tamanho:', csv.length, 'caracteres');

                allDashboards = parseCSV(csv);
                console.log('Dashboards parseados. Total:', allDashboards.length);

                if (silent) {
                    // Reload silencioso: preserva filtros ativos e não exibe loading
                    atualizarResponsaveisUnicos();
                    aplicarFiltros();
                    updateStats();
                } else {
                    renderDashboards();
                    updateStats();
                    hideLoading();
                }

                console.log('%c=== CARREGAMENTO CONCLUÍDO COM SUCESSO ===', 'color: green; font-weight: bold');

            } catch (error) {
                console.error('%c=== ERRO AO CARREGAR ===', 'color: red; font-weight: bold');
                console.error('Mensagem de erro:', error.message);
                if (!silent) {
                    showToast('Erro ao carregar dashboards: ' + error.message, 'error');
                    hideLoading();
                }
            }
        }

        // Parse CSV to array
        function parseCSV(csv) {
            console.log('%c=== PARSEANDO CSV ===', 'color: orange; font-weight: bold');
            const lines = csv.trim().split('\n');
            console.log('Total de linhas no arquivo:', lines.length);
            console.log('Tamanho do CSV:', csv.length, 'caracteres');
            
            if (lines.length < 2) {
                console.warn('⚠️ CSV não tem pelo menos 2 linhas (cabeçalho + 1 dado)');
                return [];
            }

            const headers = lines[0].split(',').map(h => h.trim());
            console.log('Cabeçalhos encontrados:', headers);
            console.log('Número de colunas:', headers.length);
            
            // Verificar se cabeçalhos estão corretos
            const expectedHeaders = ['ID', 'Nome do BI', 'Responsável', 'Status'];
            const headerMatch = headers.every(h => expectedHeaders.includes(h));
            if (!headerMatch) {
                console.warn('⚠️ AVISO: Cabeçalhos não coincidem com esperado!');
                console.warn('Esperado:', expectedHeaders);
                console.warn('Encontrado:', headers);
            }
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const obj = {};
                const values = lines[i].split(',').map(v => v.trim());
                
                if (values.length === 0 || (values.length === 1 && values[0] === '')) {
                    console.log(`Linha ${i + 1}: ignorada (vazia)`);
                    continue;
                }
                
                headers.forEach((header, index) => {
                    obj[header] = values[index] || '';
                });
                
                if (obj.ID) {
                    data.push(obj);
                    console.log(`Linha ${i + 1}: ✅ Parseada -`, obj);
                } else {
                    console.warn(`Linha ${i + 1}: ❌ Ignorada (sem ID)`, obj);
                }
            }
            
            console.log('%c=== PARSE CONCLUÍDO ===', 'color: orange; font-weight: bold');
            console.log('Total de dashboards válidos:', data.length);
            console.log('Dados parseados:', data);
            return data;
        }

        // Render dashboards
        function renderDashboards() {
            const container = document.getElementById('cardsContainer');

            if (allDashboards.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        <p style="color: var(--text-secondary); font-size: 0.875rem;">Nenhum dashboard cadastrado. Clique em "Novo Dashboard" para começar!</p>
                    </div>
                `;
                return;
            }

            // Atualizar lista de responsáveis únicos
            atualizarResponsaveisUnicos();
            
            // Limpar filtros
            document.getElementById('filtroNome').value = '';
            document.getElementById('filtroStatus').value = '';
            document.getElementById('filtroResponsavel').value = '';
            
            // Resetar para mostrar todos
            dashboardsFiltrados = [...allDashboards];
            renderDashboardsFiltrados();
        }

        // Aplicar filtros em tempo real
        function aplicarFiltros() {
            const nome = document.getElementById('filtroNome').value.toLowerCase();
            const status = document.getElementById('filtroStatus').value;
            const responsavel = document.getElementById('filtroResponsavel').value;

            dashboardsFiltrados = allDashboards.filter(dash => {
                const nomeMatch = dash['Nome do BI'].toLowerCase().includes(nome);
                const statusMatch = !status || dash['Status'] === status;
                const responsavelMatch = !responsavel || dash['Responsável'] === responsavel;

                return nomeMatch && statusMatch && responsavelMatch;
            });

            renderDashboardsFiltrados();
        }

        // Renderizar apenas os dashboards filtrados
        function renderDashboardsFiltrados() {
            const container = document.getElementById('cardsContainer');

            if (dashboardsFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1; margin-top: 2rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p style="color: var(--text-secondary); font-size: 0.875rem;">Nenhum dashboard encontrado com esses filtros.</p>
                    </div>
                `;
                return;
            }

            // Renderizar os dashboards filtrados (ordenados)
            const sorted = [...dashboardsFiltrados].sort((a, b) => {
                const statusOrder = {
                    'Manutenção': 0,
                    'Desenvolvimento': 1,
                    'Produção': 2
                };
                return (statusOrder[a['Status']] || 3) - (statusOrder[b['Status']] || 3);
            });

            container.innerHTML = sorted.map((dash, index) => {
                const statusClass = getStatusClass(dash['Status']);

                return `
                    <div class="card card-interactive" style="--index: ${index};">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem;">
                            <div style="flex: 1; min-width: 0;">
                                <h3 style="font-size: 1.125rem; font-weight: 700; margin-bottom: 0.5rem; word-break: break-word;">${dash['Nome do BI']}</h3>
                            </div>
                            <div style="display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0;">
                                <span class="badge ${statusClass}">${dash['Status']}</span>
                                ${dash['Link'] ? `
                                <a href="${dash['Link']}" target="_blank" class="btn-link-corner" title="Acessar painel">
                                    <i data-lucide="external-link" style="width: 18px; height: 18px;"></i>
                                </a>
                                ` : ''}
                            </div>
                        </div>

                        <div style="margin-bottom: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                            <p style="color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem;">Responsável</p>
                            <p style="color: var(--text-primary); font-weight: 600;">${dash['Responsável']}</p>
                        </div>

                        ${dash['Descrição'] ? `
                        <div style="margin-bottom: 1.5rem; padding: 1rem; background: rgba(59, 130, 246, 0.05); border-radius: 0.75rem; border: 1px solid var(--border-color);">
                            <p style="color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Descrição</p>
                            <p style="color: var(--text-primary); font-size: 0.875rem; line-height: 1.5;">${dash['Descrição']}</p>
                        </div>
                        ` : ''}

                        <div style="display: flex; gap: 0.5rem;">
                            <button class="btn btn-secondary btn-sm" style="flex: 1;" onclick="openEditModal('${dash['ID']}')">
                                <i data-lucide="edit-2" style="width: 14px; height: 14px;"></i>
                                Editar
                            </button>
                            <button class="btn btn-danger btn-sm" style="flex: 1;" onclick="deleteDashboard('${dash['ID']}')">
                                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                                Deletar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            initLucide();
        }

        // Atualizar lista de responsáveis únicos
        function atualizarResponsaveisUnicos() {
            responsaveisUnicos = [...new Set(allDashboards.map(d => d['Responsável']))].sort();
            
            const selectResponsavel = document.getElementById('filtroResponsavel');
            const valueSelecionado = selectResponsavel.value;
            
            selectResponsavel.innerHTML = '<option value="">Todos os Responsáveis</option>';
            responsaveisUnicos.forEach(resp => {
                const option = document.createElement('option');
                option.value = resp;
                option.textContent = resp;
                selectResponsavel.appendChild(option);
            });
            
            // Restaurar seleção anterior se existir
            if (valueSelecionado && responsaveisUnicos.includes(valueSelecionado)) {
                selectResponsavel.value = valueSelecionado;
            }
        }

        // Função para forçar recarregamento
        function forceRefreshDashboards() {
            console.log('%c🔄 Recarregamento manual iniciado pelo usuário', 'color: #10b981; font-weight: bold');
            loadDashboards();
        }

        // Get status badge class
        function getStatusClass(status) {
            if (status === 'Desenvolvimento') return 'badge-development';
            if (status === 'Produção') return 'badge-production';
            return 'badge-maintenance';
        }

        // Update stats
        function updateStats() {
            const total = allDashboards.length;
            const dev = allDashboards.filter(d => d['Status'] === 'Desenvolvimento').length;
            const prod = allDashboards.filter(d => d['Status'] === 'Produção').length;
            const maint = allDashboards.filter(d => d['Status'] === 'Manutenção').length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('devCount').textContent = dev;
            document.getElementById('prodCount').textContent = prod;
            document.getElementById('maintCount').textContent = maint;
        }

        // Open create modal
        function openCreateModal() {
            isEditing = false;
            document.getElementById('modalTitle').textContent = 'Novo Dashboard';
            document.getElementById('submitText').textContent = 'Criar';
            document.getElementById('formId').value = '';
            document.getElementById('form').reset();
            populateResponsavelSelect();
            document.getElementById('modal').classList.add('active');
        }

        // Open edit modal
        function openEditModal(id) {
            const dashboard = allDashboards.find(d => d['ID'] === id);
            if (!dashboard) return;

            isEditing = true;
            document.getElementById('modalTitle').textContent = 'Editar Dashboard';
            document.getElementById('submitText').textContent = 'Atualizar';
            document.getElementById('formId').value = id;
            document.getElementById('formName').value = dashboard['Nome do BI'];
            populateResponsavelSelect(dashboard['Responsável']);
            document.getElementById('formStatus').value = dashboard['Status'];
            document.getElementById('formDescricao').value = dashboard['Descrição'] || '';
            document.getElementById('formLink').value = dashboard['Link'] || '';
            document.getElementById('modal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Handle form submit
        async function handleSubmit(event) {
            event.preventDefault();

            const id = document.getElementById('formId').value;
            const nome = document.getElementById('formName').value;
            const responsavel = document.getElementById('formResponsavel').value;
            const status = document.getElementById('formStatus').value;
            const descricao = document.getElementById('formDescricao').value;
            const link = document.getElementById('formLink').value;

            const action = isEditing ? 'UPDATE' : 'CREATE';

            showLoading(isEditing ? 'Atualizando...' : 'Criando...');

            try {
                const formData = new FormData();
                formData.append('action', action);
                if (isEditing) formData.append('id', id);
                formData.append('nome', nome);
                formData.append('responsavel', responsavel);
                formData.append('status', status);
                formData.append('descricao', descricao);
                formData.append('link', link);

                // Fire-and-forget: no-cors impede ler a resposta, mas a operação é executada
                fetch(CONFIG.APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });

                // Atualiza o estado local imediatamente, sem esperar o CSV do Sheets sincronizar
                if (isEditing) {
                    const idx = allDashboards.findIndex(d => d['ID'] === id);
                    if (idx !== -1) {
                        allDashboards[idx]['Nome do BI'] = nome;
                        allDashboards[idx]['Responsável'] = responsavel;
                        allDashboards[idx]['Status'] = status;
                        allDashboards[idx]['Descrição'] = descricao;
                        allDashboards[idx]['Link'] = link;
                    }
                } else {
                    // CREATE: adiciona com ID temporário; o sync em background corrigirá o ID real
                    allDashboards.push({
                        'ID': 'temp_' + Date.now(),
                        'Nome do BI': nome,
                        'Responsável': responsavel,
                        'Status': status,
                        'Descrição': descricao,
                        'Link': link
                    });
                }

                atualizarResponsaveisUnicos();
                aplicarFiltros();
                updateStats();
                closeModal();
                hideLoading();
                showToast(isEditing ? 'Dashboard atualizado com sucesso!' : 'Dashboard criado com sucesso!', 'success');

                // Sync silencioso em background para garantir consistência com o Sheets
                console.log('%c⏳ Sync em background agendado para 15s...', 'color: #f59e0b; font-weight: bold');
                setTimeout(() => {
                    console.log('%c🔄 Sync silencioso com Google Sheets...', 'color: #06b6d4; font-weight: bold');
                    loadDashboards(true);
                }, 15000);

            } catch (error) {
                console.error('Erro ao salvar:', error);
                showToast('Erro ao salvar dashboard. Verifique a URL do Apps Script.', 'error');
                hideLoading();
            }
        }

        // Delete dashboard
        async function deleteDashboard(id) {
            if (!confirm('Tem certeza que deseja deletar este dashboard?')) return;

            showLoading('Deletando...');

            try {
                const formData = new FormData();
                formData.append('action', 'DELETE');
                formData.append('id', id);

                // Fire-and-forget
                fetch(CONFIG.APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });

                // Remove localmente de imediato, sem esperar o CSV sincronizar
                allDashboards = allDashboards.filter(d => d['ID'] !== id);
                atualizarResponsaveisUnicos();
                aplicarFiltros();
                updateStats();
                hideLoading();
                showToast('Dashboard deletado com sucesso!', 'success');

                // Sync silencioso em background
                console.log('%c⏳ Sync em background agendado para 15s...', 'color: #f59e0b; font-weight: bold');
                setTimeout(() => {
                    console.log('%c🔄 Sync silencioso com Google Sheets após DELETE...', 'color: #06b6d4; font-weight: bold');
                    loadDashboards(true);
                }, 15000);

            } catch (error) {
                console.error('Erro ao deletar:', error);
                showToast('Erro ao deletar dashboard', 'error');
                hideLoading();
            }
        }

        // Show loading
        function showLoading(message = 'Processando...') {
            document.getElementById('loadingText').textContent = message;
            document.getElementById('loadingOverlay').classList.add('active');
        }

        // Hide loading
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" style="width: 18px; height: 18px;"></i>
                <p style="margin: 0;">${message}</p>
            `;
            document.body.appendChild(toast);
            initLucide();

            setTimeout(() => {
                toast.remove();
            }, 4000);
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
