<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Dashboard Control</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PapaParse for CSV processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-blue': '#3b82f6',
                        'dark-bg': '#0f172a'
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' }
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 20px rgba(59, 130, 246, 0.5)' },
                            '100%': { boxShadow: '0 0 30px rgba(59, 130, 246, 0.8)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px 0 rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }
        
        .neon-border {
            border: 1px solid #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        
        .modal-backdrop {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
        }
        
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .status-developing {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
        
        .status-completed {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: 1px solid #3b82f6;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-dark-bg text-white">
    <!-- Header -->
    <header class="glass-card border-b border-gray-700 sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between w-full">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 bg-gradient-to-br from-neon-blue to-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-white to-neon-blue bg-clip-text text-transparent">
                        BI Dashboard Control
                    </h1>
                </div>
                
                <button id="refreshBtn" onclick="carregarDadosBI()" class="btn-secondary flex items-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>Atualizar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
        <!-- Stats Overview -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card rounded-xl p-6 text-center fade-in">
                <div class="text-3xl font-bold text-neon-blue" id="totalBIs">0</div>
                <div class="text-gray-300 mt-2">Total de BIs</div>
            </div>
            <div class="glass-card rounded-xl p-6 text-center fade-in" style="animation-delay: 0.1s">
                <div class="text-3xl font-bold text-yellow-400" id="developingBIs">0</div>
                <div class="text-gray-300 mt-2">Desenvolvimento</div>
            </div>
            <div class="glass-card rounded-xl p-6 text-center fade-in" style="animation-delay: 0.2s">
                <div class="text-3xl font-bold text-green-400" id="completedBIs">0</div>
                <div class="text-gray-300 mt-2">Em Produção</div>
            </div>
        </section>

        <!-- BI List -->
        <section id="biCards" class="space-y-4">
            <!-- List items will be dynamically inserted here -->
        </section>

        <!-- Loading State -->
        <div id="loadingState" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-neon-blue"></div>
            <p class="mt-4 text-gray-400">Carregando dashboards...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12 hidden">
            <svg class="w-24 h-24 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <h3 class="text-xl font-semibold text-gray-400 mb-2">Nenhum dashboard encontrado</h3>
            <p class="text-gray-500">Verifique se a planilha está configurada corretamente.</p>
        </div>
    </main>


    <script>
        // URL da planilha pública
        const urlPlanilha = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjvlzgCEKvoa8-ihDxVCGPEazUR7U90z3fz_yWEd1tk2Mvx2EUIc5W1Zz8h2DqV7tvbQvKVdkt2rnP/pub?output=csv";

        // Função principal para carregar dados da planilha
        async function carregarDadosBI() {
            try {
                document.getElementById('loadingState').classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('biCards').innerHTML = '';
                
                const resposta = await fetch(urlPlanilha);
                const dadosCSV = await resposta.text();
                
                // Usando PapaParse para converter CSV em JSON
                Papa.parse(dadosCSV, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const listaBIs = results.data;
                        
                        renderizarCards(listaBIs);
                        atualizarEstatisticas(listaBIs);
                        
                        document.getElementById('loadingState').classList.add('hidden');
                        
                        if (listaBIs.length === 0) {
                            document.getElementById('emptyState').classList.remove('hidden');
                        }
                    },
                    error: function(error) {
                        console.error("Erro ao processar CSV:", error);
                        document.getElementById('loadingState').classList.add('hidden');
                        document.getElementById('emptyState').classList.remove('hidden');
                    }
                });
            } catch (erro) {
                console.error("Erro ao carregar dados da planilha:", erro);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
        }

        // Função para renderizar os cards
        function renderizarCards(bis) {
            // Lógica de ordenação: status diferente de 'Produção' primeiro
            const ordenados = bis.sort((a, b) => {
                const aNotProduction = a.Status !== 'Produção';
                const bNotProduction = b.Status !== 'Produção';
                
                if (aNotProduction && !bNotProduction) return -1;
                if (!aNotProduction && bNotProduction) return 1;
                return 0;
            });
            
            const container = document.getElementById('biCards');
            container.innerHTML = '';
            
            ordenados.forEach((bi, index) => {
                const listItem = criarListItem(bi, index);
                container.appendChild(listItem);
            });
        }

        // Função para criar um item da lista
        function criarListItem(bi, index) {
            const item = document.createElement('div');
            item.className = 'glass-card rounded-lg p-6 fade-in hover:shadow-xl transition-all duration-300';
            item.style.animationDelay = `${index * 0.1}s`;
            
            // Determinar classe do status
            let statusClass, statusIcon;
            if (bi.Status === 'Produção') {
                statusClass = 'status-completed';
                statusIcon = '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>';
            } else {
                statusClass = 'status-developing';
                statusIcon = '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path></svg>';
            }
            
            item.innerHTML = `
                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                    <!-- Informações principais -->
                    <div class="flex-1">
                        <div class="mb-3">
                            <h3 class="text-xl font-semibold text-white mb-2">${bi.Nome || 'Sem título'}</h3>
                            <div class="inline-block">
                                <span class="status-badge ${statusClass} flex items-center space-x-1">
                                    ${statusIcon}
                                    <span>${bi.Status || 'Sem status'}</span>
                                </span>
                            </div>
                        </div>
                        
                        <!-- Descrição -->
                        ${bi.Descrição ? `
                        <div class="mb-3">
                            <p class="text-gray-300 text-sm leading-relaxed">${bi.Descrição}</p>
                        </div>
                        ` : ''}
                        
                        <!-- Responsável (exibir apenas se não for Produção) -->
                        ${bi.Status !== 'Produção' ? `
                        <div class="inline-block">
                            <div class="flex items-center bg-gradient-to-r from-blue-500/20 to-purple-500/20 border border-blue-500/30 rounded-lg px-3 py-2">
                                <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <span class="text-sm font-medium text-white">Responsável: ${bi.Responsável || 'Não informado'}</span>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                    
                    <!-- Botão de acesso -->
                    <div class="flex-shrink-0">
                        <a href="${bi.Link || '#'}" target="_blank" 
                           class="btn-primary flex items-center space-x-2"
                           ${!bi.Link ? 'onclick="event.preventDefault(); alert(\'Link não disponível\')"' : ''}>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                            <span>Acessar BI</span>
                        </a>
                    </div>
                </div>
            `;
            
            return item;
        }

        // Função para atualizar estatísticas
        function atualizarEstatisticas(bis) {
            const total = bis.length;
            const notProduction = bis.filter(bi => bi.Status !== 'Produção').length;
            const production = bis.filter(bi => bi.Status === 'Produção').length;
            
            document.getElementById('totalBIs').textContent = total;
            document.getElementById('developingBIs').textContent = notProduction;
            document.getElementById('completedBIs').textContent = production;
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            carregarDadosBI();
        });
    </script>
</body>
</html>
