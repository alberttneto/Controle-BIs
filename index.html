<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio de Dashboards | TJGO</title>
  <meta name="description" content="Portfólio de Dashboards da Coordenadoria de Transformação Digital - TJGO">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== TOPO INSTITUCIONAL ===================== -->
  <header class="top-bar">
    <div class="container top-bar-content">
      <div class="brand">
        <!-- Logo do TJGO: substitua "logo.png" pelo brasão oficial, se desejar -->
        <img src="images/logo2.png" alt="Brasão do TJGO" class="brand-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="brand-fallback-icon" aria-hidden="true">⚖️</div>
        <span class="brand-title">Portfólio de Dashboards</span>
      </div>

      <nav class="top-nav" aria-label="Navegação principal">
        <a href="#" class="active">Página inicial</a>
        <!-- <a href="#">Sobre</a>
        <a href="#">Página do projeto</a>
        <a href="#">Dashboard BI Manager</a> -->
      </nav>
    </div>
  </header>

  <div class="sub-bar">
    <p class="sub-bar-link">Coordenadoria de Transformação Digital</p>
  </div>

  <!-- ===================== BANNER DE TÍTULO ===================== -->
  <section class="hero-banner">
    <h1>Portfólio de Dashboards</h1>
  </section>

  <!-- ===================== FILTROS ===================== -->
  <section class="filters-bar container" aria-label="Filtros de busca">
    <div class="search-wrapper">
      <span class="search-icon" aria-hidden="true">🔎</span>
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Buscar dashboard pelo nome..."
        aria-label="Buscar dashboard pelo nome"
        autocomplete="off"
      >
    </div>

    <div class="status-filter" id="statusFilter" role="group" aria-label="Filtrar por status">
      <!-- Botões de status injetados dinamicamente pelo JS, com base nos dados -->
      <button class="status-btn active" data-status="todos">Todos</button>
    </div>
  </section>

  <!-- ===================== ESTADOS (loading / erro / vazio) ===================== -->
  <div id="stateContainer" class="state-container container" hidden>
    <p id="stateMessage"></p>
  </div>

  <!-- ===================== CONTEÚDO: SEÇÕES POR CATEGORIA ===================== -->
  <main class="container" id="categoriesContainer" aria-live="polite">
    <!-- Seções (uma por Categoria) com seus respectivos grids de cards são injetadas pelo JS -->
  </main>

  <footer class="app-footer">
    <div class="container">
      <p>Atualizado automaticamente a partir do Google Sheets &middot; <span id="lastUpdate"></span></p>
    </div>
  </footer>

  <!-- ===================== MODAL DE DETALHES ===================== -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Fechar modal">&times;</button>

      <div class="modal-cover">
        <img id="modalImage" src="" alt="" loading="lazy">
        <span class="badge" id="modalStatus"></span>
      </div>

      <div class="modal-body">
        <h2 id="modalTitle"></h2>
        <p class="modal-meta" id="modalMeta"></p>
        <p class="modal-description" id="modalDescription"></p>

        <dl class="modal-details" id="modalDetails">
          <!-- Detalhes extras (PROAD, versão, responsável, etc.) injetados pelo JS -->
        </dl>

        <!-- Botões de ação: cada um em sua própria linha com ícone de cópia individual (gerados pelo JS) -->
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
