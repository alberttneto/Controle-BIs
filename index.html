<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard BI Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">⚡ Dashboard BI</div>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-primary" onclick="openCreateModal()">
                    <i data-lucide="plus" style="width: 18px; height: 18px;"></i>
                    Novo Dashboard
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- Stats -->
        <div class="stats-container" id="statsContainer">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total de Dashboards</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="devCount">0</div>
                <div class="stat-label">Em Desenvolvimento</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="prodCount">0</div>
                <div class="stat-label">Em Produção</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="maintCount">0</div>
                <div class="stat-label">Manutenção</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="homoCount">0</div>
                <div class="stat-label">Homologação</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="discCount">0</div>
                <div class="stat-label">Descontinuado</div>
            </div>
        </div>

        <!-- Filtros -->
        <div style="margin-bottom: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">

            <div>
                <label>Buscar por Nome</label>
                <input type="text" id="filtroNome" placeholder="Digite o nome do BI..."
                    style="width: 100%; padding: 0.75rem; background: rgba(59, 130, 246, 0.05); border: 1px solid var(--border-color); border-radius: 0.75rem; color: var(--text-primary); font-size: 0.875rem; transition: all 0.3s;"
                    oninput="aplicarFiltros()">
            </div>

            <div>
                <label>Status</label>
                <select id="filtroStatus" onchange="aplicarFiltros()">
                    <option value="">Todos os Status</option>
                    <option value="Desenvolvimento">Desenvolvimento</option>
                    <option value="Produção">Produção</option>
                    <option value="Manutenção">Manutenção</option>
                    <option value="Homologação">Homologação</option>
                    <option value="Descontinuado">Descontinuado</option>
                </select>
            </div>

            <div>
                <label>Responsável</label>
                <select id="filtroResponsavel" onchange="aplicarFiltros()">
                    <option value="">Todos os Responsáveis</option>
                </select>
            </div>

        </div>

        <!-- Cards Grid -->
        <div class="cards-grid" id="cardsContainer">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <p style="color: var(--text-secondary); font-size: 0.875rem;">Carregando dashboards...</p>
            </div>
        </div>

    </main>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="modalTitle" style="font-size: 1.5rem; font-weight: 800;">Novo Dashboard</h2>
                <button onclick="closeModal()" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.5rem;">×</button>
            </div>

            <form id="form" onsubmit="handleSubmit(event)">
                <input type="hidden" id="formId" value="">

                <div class="form-group">
                    <label class="form-label">Nome do Dashboard *</label>
                    <input type="text" id="formName" class="form-input" placeholder="Ex: Dashboard de Vendas" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Responsável</label>
                    <select id="formResponsavel" class="form-select">
                        <option value="">Sem responsável</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Status *</label>
                    <select id="formStatus" class="form-select" required>
                        <option value="">Selecione um status</option>
                        <option value="Desenvolvimento">Desenvolvimento</option>
                        <option value="Produção">Produção</option>
                        <option value="Manutenção">Manutenção</option>
                        <option value="Homologação">Homologação</option>
                        <option value="Descontinuado">Descontinuado</option>
                    </select>
                </div>

                <!-- Seção de versão — visível apenas na edição -->
                <div class="form-group" id="versaoSection" style="display: none;">
                    <label class="form-label">Versão</label>
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.625rem 0.875rem; background: var(--bg-tertiary); border-radius: 0.625rem; margin-bottom: 0.75rem; border: 1px solid var(--border-color);">
                        <span style="color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">Atual</span>
                        <span id="versaoAtualDisplay" style="font-family: monospace, monospace; font-weight: 800; color: var(--accent-cyan); font-size: 1rem;">V1.0.0</span>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem;">
                        <label class="version-option sel-manter" data-tipo="manter" onclick="selectVersionOption('manter')">
                            <input type="radio" name="versionBump" value="manter" checked style="display:none;">
                            <span class="version-option-label">Manter</span>
                        </label>
                        <label class="version-option" data-tipo="maior" onclick="selectVersionOption('maior')">
                            <input type="radio" name="versionBump" value="maior" style="display:none;">
                            <span class="version-option-label">Major</span>
                        </label>
                        <label class="version-option" data-tipo="menor" onclick="selectVersionOption('menor')">
                            <input type="radio" name="versionBump" value="menor" style="display:none;">
                            <span class="version-option-label">Minor</span>
                        </label>
                        <label class="version-option" data-tipo="patch" onclick="selectVersionOption('patch')">
                            <input type="radio" name="versionBump" value="patch" style="display:none;">
                            <span class="version-option-label">Patch</span>
                        </label>
                    </div>
                    <p id="versaoPreview" style="text-align: right; font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem; min-height: 1.2em;"></p>
                </div>

                <div class="form-group">
                    <label class="form-label">Descrição</label>
                    <textarea id="formDescricao" class="form-input" placeholder="Ex: Dashboard com KPIs de vendas..." style="resize: vertical; min-height: 80px;"></textarea>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        <span id="submitText">Salvar</span>
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-message">
            <div class="spinner"></div>
            <p id="loadingText">Processando...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
